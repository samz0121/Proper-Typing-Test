<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/main.js" defer></script> <!-- defer is used so that the script runs only when all DOM elements are parsed -->
</head>
<body>

  <header>
    <h1>Typing Game</h1>
  </header>

  <main>
    <div id="click-zone">
      <p id="display"></p>
      <input
        id="hidden-input"
        type="text"
        autocomplete="false"
        autocapitalize="false"
        spellcheck="false"
      />
    </div>
  </main>

  <footer>
    <p>&copy; 2026</p>
  </footer>
</body>
</html>
